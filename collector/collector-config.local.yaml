# Lokale Test-Konfiguration fuer den knxreceiver.
# Diese Datei ist via .gitignore (*.local) vom Repository ausgeschlossen.
#
# Vor dem ersten Start: <MDT_ROUTER_IP> durch die IP-Adresse deines MDT IP
# Routers ersetzen (Port 3671 ist KNX/IP Standard).

extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  knx:
    connection:
      type: "tunnel"
      endpoint: "10.8.10.46:3671"
    read_startup_interval: 200ms
    address_configs:
      "30/3/6":
        name: "elektrische_arbeit_Wh"
        dpt: "13.010"
        export: true
        metric_type: "sum"
        read_startup: true
        labels:
          room: "dachboden"
          floor: "dg"
          outlet: "lueftungsanlage"
      "30/3/7":
        name: "elektrische_arbeit_Wh"
        dpt: "13.010"
        export: true
        metric_type: "sum"
        read_startup: true
        labels:
          room: "abstellraum"
          floor: "ug"
          outlet: "gefrierschrank"
      "30/3/8":
        name: "elektrische_arbeit_Wh"
        dpt: "13.010"
        export: true
        metric_type: "sum"
        read_startup: true
        labels:
          room: "heizraum"
          floor: "ug"
          outlet: "heizung"
      "30/3/9":
        name: "elektrische_arbeit_Wh"
        dpt: "13.010"
        export: true
        metric_type: "sum"
        read_startup: true
        labels:
          room: "kueche"
          floor: "ug"
          outlet: "kuehlschrank"
      "30/5/5":
        name: "gas_zaehlerstand_l"
        dpt: "12.1200"
        export: true
        metric_type: "sum"
        read_startup: true
        labels:
          room: "technikflur"
          floor: "ug"
      # "30/5/7":
      #   name: "to be defined"
      #   dpt: "something"
      #   export: true
      #   metric_type: "gauge"
      #   read_startup: false
      #   labels:
      #     room: "dachboden"
      #     floor: "dg"
exporters:
  debug:
    verbosity: detailed

service:
  # Telemetry des Collectors selbst: Self-Metrics auf 127.0.0.1:8888/metrics.
  # Dort siehst du auch knxreceiver_telegrams_received_total etc.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [knx]
      exporters: [debug]
